  <desc>Rebuild the source as one clear isometric editorial model whose blocks, cuts, levels, and spatial relations preserve identity. A single geometric metaphor becomes its base, gap, path, enclosure, or negative shape, while faint Leonardo-like studies reveal the thinking around the finished form.</desc>
